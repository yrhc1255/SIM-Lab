<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM Lab｜動物的循環建模工作室</title>
<style>
:root{--ink:#1f2a24;--muted:#5d6b63;--line:#d9ddd5;--bg:#f6f4ee;--card:#fff;--accent:#1f5c45;--accent2:#e9f2ec;--warn:#9a5a12;--sens:#2b7bd6;--motor:#e07b1a;--cent:#8a4fc4}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
a{color:var(--accent)}
header.top{padding-top:calc(10px + env(safe-area-inset-top))!important;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.5px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700}
h1{font-size:30px;margin:4px 0 4px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:17px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.note{font-size:13px;color:var(--muted)}
.notice{background:#fff8ea;border:1px solid #efd9a8;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#6b4a12}
.safety{background:#fdeeee;border:1px solid #f0c4c4;border-radius:10px;padding:8px 12px;font-size:13.5px;color:#8a2a2a;margin:8px 0}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{font:inherit;border:1px solid #c9cfc6;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
input[type=text],textarea{width:100%}
textarea{min-height:84px;resize:vertical}
button{font:inherit;border:1px solid #bfc8bf;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button:hover{background:#f1f4f0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:#174a37}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:720px){.grid5{grid-template-columns:1fr 1fr}h1{font-size:24px}}
.idbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.idtag{font-weight:800;font-size:17px}
.saved{font-size:12.5px;color:var(--accent);background:var(--accent2);border-radius:20px;padding:2px 10px}
nav.stages{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:58px;background:var(--bg);z-index:10}
nav.stages button{white-space:nowrap;border-radius:20px;font-size:14px;padding:5px 12px}
.stagehead .eyebrow{margin-bottom:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toolbar .sep{width:1px;background:var(--line);margin:0 4px}
.tool-path{border-left-width:5px!important;border-left-style:solid!important}
.e4grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media(max-width:640px){.e4grid{grid-template-columns:1fr 1fr}}
.homelink{display:inline-block;margin:0 0 6px;font-size:14px;text-decoration:none;font-weight:600}
.canvaswrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
canvas.model,canvas.view{display:block;width:100%;height:auto}
canvas.model{cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scentabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.scentabs button[data-s]{border-radius:10px 10px 0 0;border-bottom-width:3px;padding:7px 14px;font-weight:600}
.scentabs button[data-s].on{background:var(--accent);border-color:var(--accent);color:#fff}
.scentabs .focusbtn{margin-left:auto}
.task{background:#f3f7f4;border-left:4px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin:6px 0}
.labelin{max-width:320px}
.exp{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}.exptitle{font-size:14px;font-weight:700;color:var(--muted)}
.cmpcard summary{cursor:pointer}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table.data{min-width:540px}
body.noscroll{overflow:hidden}
.edwrap.focus{position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.edwrap.focus .task{display:none}
.edwrap.focus .canvaswrap{max-width:calc((100vh - 200px) * 4 / 3);margin:0 auto}
button,select,input{min-height:36px}
input[type=checkbox],input[type=radio]{min-height:0;width:18px;height:18px;vertical-align:-3px}
input[type=range]{min-height:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.ctrl input[type=range]{width:160px}
.legend{font-size:13.5px;color:var(--muted)}
.legend b.s{color:var(--sens)}.legend b.m{color:var(--motor)}.legend b.c{color:var(--cent)}
.msg{font-size:13.5px;color:var(--warn)}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:#fcfdfb}
.step h3{margin-top:0}
.status{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:#eee;color:#666}
.status.done{background:var(--accent2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:18px;padding:3px 11px;font-size:14px}
.seq{min-height:38px;border:1px dashed #c9cfc6;border-radius:10px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#fff;margin:6px 0}
.seq span.it{background:#eef3ff;border:1px solid #c9d7f5;border-radius:14px;padding:1px 9px;font-size:14px}
.seq span.ar{color:#888}
table.data{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
table.data th,table.data td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.data th{background:#f2f4ef}
table.data input,table.data select{width:100%;padding:4px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.pill{display:inline-block;background:#eef2ee;border-radius:20px;padding:2px 10px;font-size:13px;margin:2px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;flex-wrap:wrap}
details.concept summary{cursor:pointer;font-weight:700}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media(max-width:720px){.flow{grid-template-columns:1fr}}
.flow div{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fcfdfb}
.flow b{display:block;color:var(--accent)}
.guide{background:var(--accent2);border:1px solid #cfe2d6}
.vlist label{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed #e4e6e0}
.miniwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
canvas.sim{display:block;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;max-width:100%}
.big{font-size:20px;padding:10px 22px}
.fixstage{position:relative}
.hidden{display:none!important}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px}
@media(max-width:900px){.labelin{max-width:none;flex:1 1 220px}}
@media(max-width:640px){
 header.top{position:static;padding:8px 12px}
 nav.stages{top:0}
 main{padding:12px 10px 50px}
 .card{padding:12px;border-radius:12px}
 .step{padding:10px}
 h1{font-size:24px}h2{font-size:19px}
 .toolbar{gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:thin}
 .toolbar>*{flex:0 0 auto}
 .toolbar .labelin{flex:0 0 260px}
 .task{font-size:14px;padding:6px 10px}
 .toolbar button,.ctrl button,.scentabs button{font-size:13.5px;padding:5px 9px}
 .scentabs button[data-s]{flex:1 1 45%}
 .scentabs .focusbtn{margin-left:0;flex:1 1 100%}
 .ctrl{font-size:13px;gap:6px}
 .ctrl input[type=range]{width:100%;order:9}
 .legend{font-size:12.5px}
 .pager .note{display:none}
 .idtag{font-size:15px}
 .grid5{grid-template-columns:1fr 1fr}
 .edwrap.focus .canvaswrap{max-width:none}
}
@media(max-width:640px) and (orientation:landscape){.edwrap.focus .canvaswrap{max-width:calc((100vh - 60px) * 4 / 3)}.edwrap.focus .toolbar{flex-wrap:nowrap;overflow-x:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SIM Lab<small>科學探究建模實驗室</small></div>
  <div class="note">MODULE 03 · 動物的循環</div>
</header>
<main id="app"></main>
<footer>SIM Lab · 動物的循環模組（依康軒國中自然 7 上第 3 章 3.3 改編）· 作答僅保存在此瀏覽器</footer>
<script>
'use strict';
/* =========================================================
   共用設定
   ========================================================= */
const W = 800, H = 600, FRAMES = 120, FPS = 24;
const SVG_FONT = 'Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif';
const STAGES = [
  { id: 'pre', tab: '現象與前測' },
  { id: 'm1', tab: 'M1 個人初始模型' },
  { id: 'e1', tab: 'E1' }, { id: 'e2', tab: 'E2' }, { id: 'e3', tab: 'E3' }, { id: 'e4', tab: 'E4' },
  { id: 'm2', tab: 'M2 小組修正模型' },
  { id: 'review', tab: '小組互評' },
  { id: 'm3', tab: 'M3 個人最終模型' },
  { id: 'post', tab: '後測與反思' },
  { id: 'history', tab: '歷程比較' }
];
/* ================= 模組共用小工具 ================= */
const svgImg = (svg, alt, maxw) => `<div style="max-width:${maxw ? maxw + 'px' : '100%'}"><img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="${alt}" style="display:block;width:100%;height:auto"></div>`;
/* 簡易紀錄表 */
function recordTable(container, d, key, cols, rows, opts = {}) {
  if (!d[key]) d[key] = {};
  const el = h(`<div class="tablewrap"><table class="data"><thead><tr><th>${opts.corner || ''}</th>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map((r, ri) => `<tr><th>${r}</th>${cols.map((c, ci) => `<td>${c.options ? `<select data-k="${ri}_${ci}">${['', ...c.options].map(o => `<option>${o}</option>`).join('')}</select>` : `<input type="${c.type || 'text'}" data-k="${ri}_${ci}" placeholder="${c.ph || ''}"${c.type === 'number' ? ' inputmode="numeric" min="0"' : ''}>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
  container.appendChild(el);
  el.querySelectorAll('[data-k]').forEach(i => { i.value = d[key][i.dataset.k] || ''; i.addEventListener(i.tagName === 'SELECT' ? 'change' : 'input', () => { d[key][i.dataset.k] = i.value; save(); onDataChange(); }); });
}
const tableReport = (d, key, cols, rows, corner = '') => d[key] && Object.values(d[key]).some(Boolean) ? `<table><tr><th>${corner}</th>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>${rows.map((r, ri) => `<tr><td>${r}</td>${cols.map((c, ci) => `<td>${esc(d[key][ri + '_' + ci] || '')}</td>`).join('')}</tr>`).join('')}</table>` : '';
const hasTable = (d, key) => !!(d[key] && Object.values(d[key]).some(Boolean));


/* 線稿塗色工具：opt = { img, w, h, colors: { key: [名稱, 色碼] }, aria, hint } */
function drawPaint(ctx, strokes, opt) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, opt.w, opt.h);
  ctx.save(); ctx.globalAlpha = 0.55; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes || []) { ctx.strokeStyle = (opt.colors[s.c] || Object.values(opt.colors)[0])[1]; ctx.lineWidth = s.w || 14; ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]); ctx.stroke(); }
  ctx.restore();
  if (opt.img.complete && opt.img.naturalWidth) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(opt.img, 0, 0, opt.w, opt.h); ctx.restore(); }
}
function paintImage(strokes, opt) { const c = document.createElement('canvas'); c.width = opt.w; c.height = opt.h; drawPaint(c.getContext('2d'), strokes, opt); return c.toDataURL('image/png'); }
function paintTool(container, d, key, clearLabel, opt) {
  if (!Array.isArray(d[key])) d[key] = [];
  const first = Object.keys(opt.colors)[0];
  const el = h(`<div style="margin:6px 0 10px">
    <div class="row">${Object.entries(opt.colors).map(([k, [n, c]]) => `<button data-c="${k}" style="border-left:6px solid ${c}">${n}</button>`).join('')}<button data-c="eraser">橡皮擦</button><button data-a="clr">${clearLabel}</button></div>
    <div style="max-width:${opt.w}px;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff"><canvas width="${opt.w}" height="${opt.h}" style="display:block;width:100%;height:auto;touch-action:none;cursor:crosshair" aria-label="${opt.aria || '線稿，可塗色'}"></canvas></div>
    <p class="note" data-r="n"></p></div>`);
  container.appendChild(el);
  const cv = el.querySelector('canvas'), ctx = cv.getContext('2d'); let col = first, cur = null;
  const draw = () => { drawPaint(ctx, d[key], opt); el.querySelector('[data-r="n"]').textContent = `${opt.hint || '選擇顏色，在線稿上自由塗繪；橡皮擦點選可刪除整筆。'}紀錄 ${d[key].length} 筆。`; };
  opt.img.addEventListener('load', draw);
  const setC = c => { col = c; el.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === c)); };
  el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => setC(b.dataset.c)); setC(first);
  let armed = 0; const clr = el.querySelector('[data-a="clr"]');
  clr.onclick = () => { if (Date.now() - armed < 3000) { d[key] = []; armed = 0; clr.textContent = clearLabel; draw(); save(); onDataChange(); } else { armed = Date.now(); clr.textContent = '再按一次確認清除'; setTimeout(() => clr.textContent = clearLabel, 3000); } };
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * opt.w / r.width), Math.round((e.clientY - r.top) * opt.h / r.height)]; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} const p = pos(e);
    if (col === 'eraser') { const tol = e.pointerType === 'touch' ? 20 : 12; for (let i = d[key].length - 1; i >= 0; i--) { if (d[key][i].pts.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < tol + 7)) { d[key].splice(i, 1); draw(); save(); onDataChange(); break; } } return; }
    cur = { c: col, w: 14, pts: [p] }; d[key].push(cur); draw();
  });
  cv.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); const p = pos(e), l = cur.pts[cur.pts.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 2) { cur.pts.push(p); draw(); } });
  const end = () => { if (cur) { cur = null; save(); onDataChange(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('touchmove', e => { if (cur) e.preventDefault(); }, { passive: false });
  draw();
}

/* 預測曲線：學生先徒手畫預測（橘色虛線），再與表格資料（一或多條）疊圖比較
   opt = { xLabels, yMin, yMax, yStep, yLabel, series: [{ col, label, color }], title, hint } */
function curveTool(container, d, key, dataKey, opt) {
  if (!Array.isArray(d[key])) d[key] = [];
  const Wc = 560, Hc = 300, L = 56, R = 20, T = 30, B = 56, n = opt.xLabels.length, y0 = opt.yMin || 0;
  const el = h(`<div style="margin:8px 0"><div style="max-width:${Wc}px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff"><canvas width="${Wc}" height="${Hc}" style="display:block;width:100%;height:auto;touch-action:none;cursor:crosshair" aria-label="${opt.title}"></canvas></div>
    <div class="row" style="margin-top:6px"><button data-a="clr">清除預測曲線</button><span class="note">${opt.hint}</span></div></div>`);
  container.appendChild(el);
  const cv = el.querySelector('canvas'), ctx = cv.getContext('2d'); let cur = null;
  const xOf = i => L + i * (Wc - L - R) / (n - 1), yOf = v => Hc - B - (v - y0) / (opt.yMax - y0) * (Hc - T - B);
  function draw() {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, Wc, Hc); ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.font = '12px sans-serif'; ctx.fillStyle = '#555';
    for (let v = y0; v <= opt.yMax + 1e-9; v += opt.yStep) { const y = yOf(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(Wc - R, y); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(Math.round(v * 10) / 10, L - 6, y + 4); }
    ctx.textAlign = 'center'; opt.xLabels.forEach((s, i) => ctx.fillText(s, xOf(i), Hc - B + 18));
    ctx.save(); ctx.translate(14, (Hc - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(opt.yLabel, 0, 0); ctx.restore();
    ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, Hc - B); ctx.lineTo(Wc - R, Hc - B); ctx.stroke();
    if (d[key].length > 1) { ctx.strokeStyle = '#e0601a'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); d[key].forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); }
    const tb = d[dataKey] || {};
    opt.series.forEach(sr => {
      const pts = opt.xLabels.map((_, i) => parseFloat(tb[i + '_' + sr.col])).map((v, i) => isNaN(v) ? null : [xOf(i), yOf(Math.max(y0, Math.min(v, opt.yMax)))]);
      ctx.strokeStyle = sr.color; ctx.fillStyle = sr.color; ctx.lineWidth = 2.5; ctx.beginPath(); let st = false; pts.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(...p); st = true; } else ctx.lineTo(...p); }); ctx.stroke();
      pts.forEach(p => { if (p) { ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 7); ctx.fill(); } });
    });
    ctx.textAlign = 'left'; ctx.font = 'bold 12px sans-serif'; let lx = L + 6;
    ctx.fillStyle = '#e0601a'; ctx.fillText('- - 我的預測', lx, 16); lx += 92;
    opt.series.forEach(sr => { ctx.fillStyle = sr.color; ctx.fillText('●— ' + sr.label, lx, 16); lx += ctx.measureText('●— ' + sr.label).width + 18; });
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * Wc / r.width), Math.round((e.clientY - r.top) * Hc / r.height)]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} d[key] = [pos(e)]; cur = d[key]; draw(); });
  cv.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); const p = pos(e), l = cur[cur.length - 1]; if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) > 3) { cur.push(p); draw(); } });
  const end = () => { if (cur) { cur = null; save(); onDataChange(); } }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('touchmove', e => { if (cur) e.preventDefault(); }, { passive: false });
  el.querySelector('[data-a="clr"]').onclick = () => { d[key] = []; draw(); save(); onDataChange(); };
  const onAny = () => { if (!document.body.contains(el)) { document.removeEventListener('input', onAny); document.removeEventListener('curveupdate', onAny); return; } draw(); };
  if (container.isConnected) { document.addEventListener('input', onAny); document.addEventListener('curveupdate', onAny); }
  draw();
  return { image: () => { draw(); return cv.toDataURL('image/png'); } };
}
function curveImage(d, key, dataKey, opt) { const tmp = document.createElement('div'); tmp.style.cssText = 'position:absolute;left:-9999px'; document.body.appendChild(tmp); const c = curveTool(tmp, d, key, dataKey, opt); const u = c.image(); tmp.remove(); return u; }

/* =========================================================
   模組設定：動物的循環（康軒 7 上 第 3 章 3.3 人體內物質的運輸）

  }

  const fb = root.querySelector('[data-a="focus"]');
  fb.onclick = () => { const on = !ed.classList.contains('focus'); ed.classList.toggle('focus', on); document.body.classList.toggle('noscroll', on); fb.textContent = on ? '✕ 結束放大' : '⤢ 放大畫布'; paint(); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy; let t = L ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
  function hit(p) {

    if (drawing.type === 'arrow') { drawing.pts[1] = p; }
    else { const l = drawing.pts[drawing.pts.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 3) drawing.pts.push(p); }
    paint();
  });

    if (!drawing) return; const d = drawing; drawing = null; const arr = strokes();

  };

  cv.addEventListener('touchmove', e => { if (drawing || drag) e.preventDefault(); }, { passive: false });
  root.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { snap(); const s = { id: uid(), type: 'comp', kind: b.dataset.c, x: 640 + Math.random() * 60, y: 430 + Math.random() * 60 }; strokes().push(s); setTool('select'); selId = s.id; commit(); pc.status('已加入元件，請用「選取／移動」拖到你要的位置。'); });

  q('note').addEventListener('input', () => { draft[cur].note = q('note').value; save(); });
  const cmp = q('cmp');
  if (cmp) {
    q('cmptext').value = draft.cmp || ''; q('cmptext').addEventListener('input', () => { draft.cmp = q('cmptext').value; save(); });
    cmp.addEventListener('toggle', () => { const v = q('cmpview'); v.innerHTML = ''; if (cmp.open) makePlayer(v, SK.map(k => ({ base: k, strokes: draft[k].strokes, title: SCEN[k].name })), `${stageLabel}_並排`); });
  }

    const n = S.versions.filter(v => v.stage === stageLabel).length + 1;
    const v = { id: uid(), stage: stageLabel, label: `${stageLabel} 第 ${n} 版`, time: Date.now(), cmp: draft.cmp || '' }; SK.forEach(k => v[k] = clone(draft[k])); S.versions.push(v);

  };
  window.addEventListener('keydown', function kh(e) {
    if (!document.body.contains(root)) { window.removeEventListener('keydown', kh); return; }
    if (e.key === 'Escape' && ed.classList.contains('focus')) { fb.click(); return; }

  });
  switchTo(SK[0]);
  return { root };
}

    const el = h(`<div class="step" style="margin:8px 0"><div style="font-weight:600">${i + 1}. ${txt}</div>

      <input type="text" placeholder="理由：我看到對方的模型中…" data-r="why"></div>`);
    el.querySelectorAll('input[type=radio]').forEach(r => { r.checked = it.lv === r.value; r.onchange = () => { it.lv = r.value; save(); count(); }; });
    const w = el.querySelector('[data-r="why"]'); w.value = it.why; w.oninput = () => { it.why = w.value; save(); };
    box.appendChild(el);
  });
  const g = c.querySelector('[data-r="grp"]'); g.value = rb.group; g.oninput = () => { rb.group = g.value; save(); };
  const t = c.querySelector('[data-r="free"]'); t.value = S.review; t.oninput = () => { S.review = t.value; save(); };
  count();
}
function rubricReport() {
  const rb = S.rubric || { group: '', items: {} };
  const rows = MODULE.review.rubric.map((txt, i) => { const it = rb.items[i] || {}; return `<tr><td style="text-align:left">${i + 1}. ${txt}</td><td>${esc(it.lv || '—')}</td><td style="text-align:left">${esc(it.why || '')}</td></tr>`; }).join('');
  return `<p><b>被評組別：</b>${esc(rb.group || '—')}</p><table><tr><th>規準</th><th>評定</th><th>理由</th></tr>${rows}</table>`;
}
function renderPost(c) {
  const P = MODULE.post;
  c.appendChild(h(`<div><h2>後測與反思</h2>
    <h3>後測</h3>
    ${P.qs.map((q, i) => `<label class="f">${i + 1}. ${q}</label><textarea data-k="q${i + 1}"></textarea>`).join('')}
    <h3>學習反思</h3>
    <label class="f">${P.reflection}</label><textarea data-k="refl"></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" data-a="rep">一鍵匯出建模歷程</button><span class="note" data-r="m"></span></div></div>`));
  c.querySelectorAll('[data-k]').forEach(t => bindText(t, S.post, t.dataset.k));
  c.querySelector('[data-a="rep"]').onclick = () => exportReport(c.querySelector('[data-r="m"]'));
}
function versionNotes(v) {
  const lines = SK.map(k => `<b>${scenNoteLabel(k)}：</b>${esc(v[k].note || '（無）')}`);
  if (SK.length > 1) lines.push(`<b>${MODULE.cmpShort || '情境異同'}：</b>${esc(v.cmp || '（無）')}`);
  return lines.join('\n');
}
function renderHistory(c) {
  c.appendChild(h(`<div><h2>歷程比較</h2><div class="row"><button class="primary" data-a="rep">一鍵匯出建模歷程</button><span class="note" data-r="m"></span></div></div>`));
  c.querySelector('[data-a="rep"]').onclick = () => exportReport(c.querySelector('[data-r="m"]'));
  c.appendChild(evidenceSummary());
  const box = h(`<div class="card"><h3 style="margin-top:0">模型版本比較</h3><p class="note">選擇最多兩個已保存的版本（例如 M1 與 M3），並排比較原始路徑及動畫${SK.length > 1 ? '；手機上會改為上下排列' : ''}。</p><div class="vlist"></div><div data-r="cmp" class="${SK.length > 1 ? '' : 'two'}" style="margin-top:12px"></div></div>`);
  c.appendChild(box);
  const list = box.querySelector('.vlist'), cmp = box.querySelector('[data-r="cmp"]');
  if (!S.versions.length) { list.innerHTML = '<p class="note">尚無保存版本，請先至 M1、M2 或 M3 保存。</p>'; return; }
  const chosen = [];
  const draw = () => {
    cmp.innerHTML = '';
    chosen.forEach(id => {
      const vv = S.versions.find(x => x.id === id);
      const col = h(`<div class="card" style="background:#fcfdfb;margin:0 0 12px"><h3 style="margin-top:0">${esc(vv.label)} <span class="note">${new Date(vv.time).toLocaleString('zh-TW')}</span></h3></div>`); cmp.appendChild(col);
      makePlayer(col, versionPanels(vv), vv.label);
      col.appendChild(h(`<div class="note" style="white-space:pre-wrap;margin-top:8px">${versionNotes(vv)}</div>`));
    });
  };
  S.versions.forEach(v => {
    const row = h(`<label><input type="checkbox"> <b>${esc(v.label)}</b> <span class="note">${new Date(v.time).toLocaleString('zh-TW')} · ${SK.map(k => (SK.length > 1 ? k.toUpperCase() + ' ' : '') + v[k].strokes.length + ' 筆').join('、')}</span></label>`);
    const cb = row.querySelector('input');
    cb.onchange = () => {
      if (cb.checked) { chosen.push(v.id); if (chosen.length > 2) { const drop = chosen.shift(); list.querySelectorAll('input').forEach((x, i) => { if (S.versions[i].id === drop) x.checked = false; }); } }
      else chosen.splice(chosen.indexOf(v.id), 1);
      draw();
    };
    list.appendChild(row);
  });
}

/* =========================================================
   匯出建模歷程（HTML 報告）
   ========================================================= */
function exportReport(msgEl) {
  const sec = (t, b) => `<h2>${t}</h2>${b}`;
  const p = (q, a) => `<p><b>${esc(q)}</b><br>${esc(a || '（未填寫）').replace(/\n/g, '<br>')}</p>`;
  const vers = S.versions.map(v => `<div class="v"><h3>${esc(v.label)} <small>${new Date(v.time).toLocaleString('zh-TW')}</small></h3><img src="${renderPanels(versionPanels(v), null, 600).toDataURL('image/png')}" alt="${esc(v.label)}"><p style="white-space:pre-wrap">${versionNotes(v)}</p></div>`).join('') || '<p>（尚無保存版本）</p>';
  const st = id => { const d = S.e[id], cfg = MODULE.stations[id]; let extra = ''; try { extra = cfg.report ? cfg.report(d) : ''; } catch (e) {}
    return `<h3>${cfg.title}</h3>${p('預測與理由', d.pred)}${extra}${p('觀察紀錄', d.obs)}<p><b>對模型：</b>${SUP[d.support] || '未選'}　<b>相關項目：</b>${esc((d.tags || []).join('、') || '—')}</p>${p('連結理由', d.reason)}${p('修正想法', d.revise)}`; };
  const strip = q => q.replace(/<[^>]+>/g, '');
  const html = `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${MODULE.title}建模歷程｜${esc(fileBase())}</title><style>body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:900px;margin:30px auto;padding:0 16px;line-height:1.7;color:#222}h1{border-bottom:3px solid #1f5c45}h2{color:#1f5c45;margin-top:28px;border-bottom:1px solid #ddd}img{max-width:100%;border:1px solid #ccc;border-radius:8px}table{border-collapse:collapse;margin:6px 0}td,th{border:1px solid #ccc;padding:4px 8px;text-align:center}.v{page-break-inside:avoid;margin-bottom:20px}small{color:#777;font-weight:400}</style></head><body>
  <h1>${MODULE.title}建模歷程</h1><p>${esc(ident.year)} 學年度 · ${esc(ident.cls)} 班 · ${esc(ident.no)} 號 · ${esc(ident.name)} · 第 ${esc(ident.group)} 組<br>匯出時間：${new Date().toLocaleString('zh-TW')}</p>
  ${sec('現象與前測', p('現象紀錄', S.pre.phen) + MODULE.pre.qs.map((q, i) => p(`前測 ${i + 1}：${strip(q)}`, S.pre['q' + (i + 1)])).join(''))}
  ${sec('模型版本（M1 → M2 → M3）', vers)}
  ${sec('證據探究 E1～E4', EIDS.map(st).join(''))}
  ${sec('小組互評', rubricReport() + `<p><b>其他回饋：</b><br>${esc(S.review).replace(/\n/g, '<br>')}</p>`)}
  ${sec('後測與反思', MODULE.post.qs.map((q, i) => p(`後測 ${i + 1}：${strip(q)}`, S.post['q' + (i + 1)])).join('') + p('學習反思', S.post.refl))}
  </body></html>`;
  download(`${MODULE.fileLabel}建模歷程_${fileBase()}.html`, new Blob([html], { type: 'text/html' }));
  if (msgEl) msgEl.textContent = '已產生 HTML 歷程檔，可用瀏覽器開啟後列印或另存 PDF。';
}

/* =========================================================
   主畫面
   ========================================================= */
function conceptPanel(withPreview = true) {
  const C = MODULE.concept;
  const el = h(`<details class="card concept"><summary>${withPreview ? '教學概念、45 分鐘建議流程與目前模型預覽' : '教學概念與 45 分鐘建議流程'}</summary>
    <h3>學習概念</h3>
    <div>${C.items.map(x => `<span class="pill">${x}</span>`).join('')}</div>
    ${C.note ? `<p class="note" style="margin-top:8px">${C.note}</p>` : ''}
    <div class="flow">${C.flow.map(([t, d]) => `<div><b>${t}</b>${d}</div>`).join('')}</div>
    ${withPreview ? `<h3>目前模型預覽</h3><p class="note">預覽最新保存版本（若無則為 M1 草稿）；${C.previewNote}</p><div data-r="pv"></div>` : ''}
  </details>`);
  let made = false;
  if (withPreview) el.addEventListener('toggle', () => { if (el.open && !made) { made = true; const last = S.versions[S.versions.length - 1]; makePlayer(el.querySelector('[data-r="pv"]'), versionPanels(last || S.drafts.m1), last ? last.label : 'M1 草稿'); } });
  return el;
}
function guideBox() {
  const G = MODULE.guides;
  const el = h(`<div class="card guide"><h3 style="margin-top:0">讓好問題帶你再想一步</h3><p data-r="q" style="font-size:17px"></p><button>換一個引導問題</button></div>`);
  const q = el.querySelector('[data-r="q"]'); q.textContent = G[(S?.guide || 0) % G.length];
  el.querySelector('button').onclick = () => { S.guide = ((S.guide || 0) + 1) % G.length; q.textContent = G[S.guide]; save(); };
  return el;
}
const pageHead = () => `<div>${homeLink()}<div class="eyebrow">MODULE ${MODULE.no} / ${MODULE.en}</div><h1>${MODULE.title}</h1><p class="lead">${MODULE.lead}</p></div>`;
function homeLink() { return (window.claude || !MODULE.homeUrl) ? '' : `<a class="homelink" href="${MODULE.homeUrl}">← 所有教學模組</a>`; }
function renderIntro(app) {
  const last = Store.get(PREFIX + 'last') || Store.get('simlab-last-ident') || {};
  const el = h(`<div>${pageHead()}
    <div class="notice">作答會即時保存在「這台裝置的這個瀏覽器」。此版本沒有連接 Google 課堂或教師後台；換裝置或清除瀏覽資料前，請用「匯出完整備份」保存。</div>
    <div class="card"><h2>進入建模工作室</h2><p class="note">身分欄位只用於本機作業辨識，不是帳號驗證。</p>
      <form><div class="grid5">
        <div><label class="f">學年度</label><input type="text" name="year" required></div>
        <div><label class="f">班級</label><input type="text" name="cls" required></div>
        <div><label class="f">座號</label><input type="text" name="no" required></div>
        <div><label class="f">姓名／測試代號</label><input type="text" name="name" required></div>
        <div><label class="f">組別</label><input type="text" name="group" required></div>
      </div><div class="row" style="margin-top:14px"><button class="primary big" type="submit">開始探究</button><input type="file" accept=".json" data-r="imp" style="display:none"><button type="button" data-a="imp">匯入備份檔</button></div></form>
    </div></div>`);
  app.appendChild(el); app.appendChild(conceptPanel(false));
  const f = el.querySelector('form');
  f.year.value = last.year || '115'; ['cls', 'no', 'name', 'group'].forEach(k => f[k].value = last[k] || '');
  f.onsubmit = e => { e.preventDefault(); login({ year: f.year.value.trim(), cls: f.cls.value.trim(), no: f.no.value.trim(), name: f.name.value.trim(), group: f.group.value.trim() }); };
  const imp = el.querySelector('[data-r="imp"]');
  el.querySelector('[data-a="imp"]').onclick = () => imp.click();
  imp.onchange = async () => { try { const j = JSON.parse(await imp.files[0].text()); if (!j.ident || !j.state) throw new Error('格式不符'); if (j.module && j.module !== MODULE.id) throw new Error('這是其他模組的備份檔'); Store.set(idKey(j.ident), j.state); login(j.ident); } catch (e) { alertMsg(el, '匯入失敗：' + e.message); } };
}
function alertMsg(el, m) { let n = el.querySelector('.msg.alert'); if (!n) { n = h('<p class="msg alert"></p>'); el.appendChild(n); } n.textContent = m; }
function login(i) {
  ident = i; Store.set(PREFIX + 'last', i); Store.set('simlab-last-ident', i);
  const st = Store.get(idKey(i)); S = Object.assign(blankState(), st || {});
  S.e = Object.assign({ e1: {}, e2: {}, e3: {}, e4: {} }, S.e); S.drafts = Object.assign(blankState().drafts, S.drafts); migrate(S);
  saveNow(); if (!STAGES.some(x => '#' + x.id === location.hash)) location.hash = '#pre'; else render();
}
function render() {
  const app = $('#app'); app.innerHTML = ''; onDataChange = () => {};
  if (!ident) { renderIntro(app); return; }
  const cur = (location.hash.replace('#', '') || 'pre'); const idx = Math.max(0, STAGES.findIndex(s => s.id === cur)); const stage = STAGES[idx];
  app.appendChild(h(pageHead()));
  const bar = h(`<div class="card idbar"><div><div class="idtag">${esc(ident.cls)}・${esc(ident.no)}・${esc(ident.name)}・第 ${esc(ident.group)} 組</div><div class="note">${esc(ident.year)} 學年度 <span class="saved" id="savedFlag">已儲存在此瀏覽器</span></div></div>
    <div class="row"><button data-a="bk">匯出完整備份</button><button data-a="sw">切換身分</button></div></div>`);
  bar.querySelector('[data-a="bk"]').onclick = () => { saveNow(); download(`${MODULE.fileLabel}備份_${fileBase()}.json`, new Blob([JSON.stringify({ app: 'simlab', module: MODULE.id, version: 2, ident, state: S }, null, 1)], { type: 'application/json' })); };
  bar.querySelector('[data-a="sw"]').onclick = () => { saveNow(); ident = null; S = null; location.hash = ''; render(); };
  app.appendChild(bar);
  const nav = h('<nav class="stages" aria-label="探究階段"></nav>');
  STAGES.forEach((s, i) => { const b = h(`<button>${s.tab}</button>`); if (i === idx) b.classList.add('on'); b.onclick = () => location.hash = '#' + s.id; nav.appendChild(b); });
  app.appendChild(nav);
  const card = h(`<div class="card"><div class="eyebrow">探究階段 ${idx + 1} / ${STAGES.length}</div><div data-r="body"></div>
    <div class="pager"><button data-a="prev">上一階段</button><span class="note">輸入自動儲存；完成度不代表得分</span><button class="primary" data-a="next">下一階段</button></div></div>`);
  app.appendChild(card);
  const body = card.querySelector('[data-r="body"]');
  ({ pre: renderPre, m1: c => renderModel(c, 'm1'), m2: c => renderModel(c, 'm2'), m3: c => renderModel(c, 'm3'), e1: c => renderStation(c, 'e1'), e2: c => renderStation(c, 'e2'), e3: c => renderStation(c, 'e3'), e4: c => renderStation(c, 'e4'), review: renderReview, post: renderPost, history: renderHistory })[stage.id](body);
  const pv = card.querySelector('[data-a="prev"]'), nx = card.querySelector('[data-a="next"]');
  pv.disabled = idx === 0; nx.disabled = idx === STAGES.length - 1;
  pv.onclick = () => location.hash = '#' + STAGES[idx - 1].id; nx.onclick = () => location.hash = '#' + STAGES[idx + 1].id;
  app.appendChild(conceptPanel()); app.appendChild(guideBox());
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { if (ident) render(); });
window.addEventListener('beforeunload', () => { if (ident) saveNow(); });
(function init() { render(); })();

</script>
